about:
  title: "About me – Building cultures that thrive"
  paragraphs:
    - >-
      My journey through technology and leadership has taught me that the most meaningful
      progress happens when people, purpose, and strategy align.
      Throughout my career, I've worked across sectors such as education, finance,
      transportation, and telecommunications&nbsp;&ndash; always with a clear focus on
      scalable, secure, and user-centric solutions.
    - >-
      Today, as Co-CEO of <a href="https://www.untis.at" target="_blank">Untis</a>, I focus on
      shaping the organization where trust is stronger than hierarchy, and where teams have the
      clarity and autonomy to do their best work.
    - >-
      My leadership blends transformational and servant principles: inspiring change, enabling
      ownership, and fostering collaboration across all levels. Agile ways of working, for me,
      are less about processes and more about creating the right conditions for people to
      adapt, innovate, and grow.
    - >-
      What drives me every day is seeing people grow, ideas take shape, and cultures emerge
      that can thrive in the complex, ever-changing world of education technology.

