about:
  title: "Über mich – Kulturen, die sich entfalten"
  paragraphs:
    - >-
      Meine Reise durch die Welt der Technologie und Unternehmensführung hat mich gelehrt,
      dass der bedeutendste Fortschritt dann entsteht, wenn Menschen, Ziele und Strategie aufeinander abgestimmt sind.
      Im Laufe meiner Karriere war ich in verschiedenen Branchen wie Bildung, Finanzen,
      Verkehr und Telekommunikation tätig&nbsp;&ndash; stets mit einem klaren Fokus auf
      skalierbare, sichere und nutzerorientierte Lösungen.
    - >-
      Heute konzentriere ich mich als Co-CEO von <a href="https://www.untis.at" target="_blank">Untis</a>, 
      das Unternehmen so zu gestalten, dass Vertrauen stärker ist als Hierarchien und dass die Teams über die
      notwendige Klarheit und Autonomie verfügen, um ihre beste Leistung zu erbringen.
    - >-
      Mein Führungsstil verbindet Prinzipien der transformationalen Führung mit denen der dienenden Führung: 
      Veränderung anstoßen, Eigenverantwortung ermöglichen und Zusammenarbeit über alle Ebenen hinweg fördern.
      Agiles Arbeiten heißt für mich weniger Prozess als vielmehr die richtigen Bedingungen
      dafür zu schaffen, dass Menschen sich anpassen, Neues wagen und wachsen können.
    - >-
      Was mich täglich antreibt: zu sehen, wie Menschen wachsen, Ideen Gestalt annehmen und
      Kultur entsteht, die in der komplexen, sich ständig wandelnden Welt der
      Bildungstechnologie tragfähig bleibt.

