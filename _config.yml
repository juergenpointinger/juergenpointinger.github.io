# --- General options --- #

# Name of website
title: © Jürgen Pointinger

# email: your-email@example.com

# Short description of your site
description: >- # this means to ignore newlines until "baseurl:"
  A blog about DevOps, Agility, Software Development Practices, Coding and Leadership.
  Created by Jürgen Pointinger, an IT Consultant, DevOps Enthusiast, Solution Architect and Software Developer.

# --- Local development options ---
# If your website is hosted locally rather than on GitHub, then you need to uncomment the next two parameters to set the url and baseurl
# *** If you're not sure what this mean, then leave this section as it is. Only modify the url and baseurl if you know what you're doing!***

# url is the the website domain URL without a trailing slash
url: "https://juergenpointinger.github.io"

# baseurl should be an empty string
#baseurl: ""

permalink: /:title/

theme: jekyll-theme-primer

# --- Languages (i18n) --- #

# Standardsprache. Sie wird auf der Root-URL ausgeliefert und gilt fuer alle
# Seiten, die in ihrem Front Matter kein eigenes "lang" setzen.
lang_default: de

# Reihenfolge bestimmt die Anzeige im Sprachumschalter.
# "url" muss dem Permalink der jeweiligen Sprachvariante der Startseite entsprechen.
languages:
  - code: de
    name: Deutsch
    url: /
  - code: en
    name: English
    url: /en/

# Blog und Rechtstexte sind (noch) ausschliesslich englisch -> Chrome in Englisch.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      lang: en
  - scope:
      path: "sitemap"
    values:
      lang: en

# --- Misc --- #

# Image to show in meta tags - image must be a square (width = height)
avatar: /assets/images/avatar.jpg

# Shortcut Icon (svg)
favicon: /assets/images/logo_light.svg

# --- Footer options --- #

# Important: you must keep the "name" parameter, everything else you can remove
author:
  name: Jürgen Pointinger
  twitter: pointij
  github: juergenpointinger

# --- Web Statistics Section --- #

# Fill in your Google Analytics gtag.js ID to track your website using gtag
gtag: "UA-163914938-1"

# --- Don't need to touch anything below here (but you can if you want) --- #

# Exclude these files from production site
exclude:
  - .jekyll-cache/
  - node_modules/
  - gemfiles/
  - CHANGELOG.md
  - CNAME
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - Vagrantfile
  - logo.psd
  - transformational-leadership-model.psd
  - diagrams.pptx

plugins:
  - jekyll-feed
